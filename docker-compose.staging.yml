# Staging stack. Usage (from the repo root):
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
# Only Caddy publishes ports (80/443). PostgreSQL and FastAPI are reachable only on private networks.
name: sapsdk-staging

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.staging}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  # One-shot: applies Alembic migrations (with the safe baseline check) before the API starts.
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    image: sapsdk-backend:staging
    restart: "no"
    command: ["python", "scripts/migrate.py"]
    environment: &backend_env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.staging (openssl rand -hex 32)}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      CORS_ORIGINS: https://${SITE_ADDRESS:?Set SITE_ADDRESS in .env.staging}
      AUTO_CREATE_SCHEMA: "false"
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10/minute}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
    logging: *logging

  backend:
    image: sapsdk-backend:staging
    restart: unless-stopped
    environment: *backend_env
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    expose: ["8000"]
    networks: [private, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *logging

  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    image: sapsdk-web:staging
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  # No outbound route and no published ports: PostgreSQL lives only here.
  private:
    internal: true
  # Caddy <-> backend; also gives the backend outbound access to OpenRouter.
  edge: {}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
